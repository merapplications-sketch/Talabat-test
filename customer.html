<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talabat — Customer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f8;color:#333;padding-bottom:130px}
.hd{background:#ff5a00;color:#fff;padding:26px 15px 15px;border-radius:0 0 20px 20px}
.hd small{font-size:11px;opacity:.9}.hd b{display:block;font-size:15px;margin-top:2px}
.pg{padding:15px}h2{font-size:17px;margin-bottom:12px;color:#1a202c}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 15px 0;scrollbar-width:none}
.chip{flex-shrink:0;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:#ff5a00;color:#fff;border-color:#ff5a00}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #edf2f7}
.st{padding:0;overflow:hidden;cursor:pointer}.st img{width:100%;height:120px;object-fit:cover;display:block;background:#edf2f7}
.st div{padding:11px 13px}.st b{font-size:15px}.st p{font-size:12px;color:#718096;margin-top:2px}
.tag{background:#ff5a00;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
.tag.x{background:#e74c3c}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.it img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#eee}
.it .i{flex:1}.pr{color:#ff5a00;font-weight:700}
.btn{background:#ff5a00;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer}
.btn.big{width:100%;padding:14px;font-size:15px;border-radius:12px}.btn.g{background:#edf2f7;color:#2d3748}.btn.r{background:#e74c3c}
.qty{display:flex;align-items:center;background:#ff5a00;border-radius:8px;color:#fff;font-weight:700}
.qty button{background:none;border:0;color:#fff;padding:6px 11px;font-size:15px;cursor:pointer}
input[type=text]{width:100%;padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;outline:0}
.bar{position:fixed;left:15px;right:15px;bottom:70px;background:#ff5a00;color:#fff;padding:14px 18px;border-radius:14px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer;box-shadow:0 4px 18px #ff5a0066}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav div{flex:1;text-align:center;padding:9px 0;font-size:11px;font-weight:600;color:#718096;cursor:pointer}.nav div.on{color:#ff5a00}.nav span{display:block;font-size:19px}
.step{display:flex;gap:10px;align-items:center;margin-bottom:12px;color:#a0aec0;font-weight:600}
.step i{width:22px;height:22px;border-radius:50%;background:#cbd5e1;flex-shrink:0}.step.on{color:#1a202c}.step.on i{background:#ff5a00}
.chat{max-height:120px;overflow:auto;display:flex;flex-direction:column;gap:5px;margin:8px 0;font-size:12px}
.m{padding:6px 10px;border-radius:8px;max-width:80%;background:#edf2f7}.m.me{align-self:flex-end;background:#fff3ed;color:#c2410c}
.tip{flex:1;text-align:center;border:1px solid #cbd5e1;border-radius:8px;padding:8px 0;font-size:12px;font-weight:700;cursor:pointer}.tip.on{border-color:#ff5a00;background:#fff3ed;color:#ff5a00}
</style></head><body>
<div id="app"></div>
<script src="talabat-core.js"></script>
<script>
TLB.addDict({home:'Главная',orders:'Заказы',me:'Профиль',deliverTo:'ДОСТАВКА В',all:'Все',rest:'Рестораны',grocery:'Продукты',pharmacy:'Аптеки',beauty:'Красота',flowers:'Цветы',sweets:'Сладости',noMenu:'Меню скоро появится',closed:'Закрыто',addBtn:'Добавить',cartEmpty:'Корзина пуста',sub:'Подытог',deliv:'Доставка',disc:'Скидка',tip:'Чаевые курьеру',total:'Итого',promo:'Промокод',apply:'Применить',promoBad:'Неверный промокод',payM:'Способ оплаты',apple:'Apple Pay',card:'Карта Alif',cash:'Наличными курьеру',place:'Оплатить заказ',noOrders:'Заказов пока нет',track:'Отслеживать',back:'Назад',courier:'Курьер',cancelO:'Отменить заказ',chatH:'Сообщение курьеру',send:'Отправить',langL:'Язык',none:'Нет',s_pending:'Ожидание',s_preparing:'Готовится',s_pickedup:'В пути',s_delivered:'Доставлено',cartT:'Корзина',addr:'Адрес доставки',note:'Демо: данные хранятся в браузере'},
{home:'Home',orders:'Orders',me:'Profile',deliverTo:'DELIVER TO',all:'All',rest:'Restaurants',grocery:'Groceries',pharmacy:'Pharmacy',beauty:'Beauty',flowers:'Flowers',sweets:'Sweets',noMenu:'Menu coming soon',closed:'Closed',addBtn:'Add',cartEmpty:'Your cart is empty',sub:'Subtotal',deliv:'Delivery',disc:'Discount',tip:'Courier tip',total:'Total',promo:'Promo code',apply:'Apply',promoBad:'Invalid promo code',payM:'Payment method',apple:'Apple Pay',card:'Alif card',cash:'Cash to courier',place:'Pay for order',noOrders:'No orders yet',track:'Track',back:'Back',courier:'Courier',cancelO:'Cancel order',chatH:'Message courier',send:'Send',langL:'Language',none:'None',s_pending:'Waiting',s_preparing:'Preparing',s_pickedup:'On the way',s_delivered:'Delivered',cartT:'Cart',addr:'Delivery address',note:'Demo: data is stored in this browser'});
const t=TLB.t,esc=TLB.esc,$=id=>document.getElementById(id);
const U=i=>`https://images.unsplash.com/${i}?w=500`;
const STORES=[
{n:'Romant Restaurant',c:'rest',d:'Local & European',r:'4.9',tm:'20-30',p:'-40%',i:'photo-1517248135467-4c7edcad34c4'},
{n:'Burger King Dushanbe',c:'rest',d:'Fast Food • Burgers',r:'4.7',tm:'15-25',p:'-50%',i:'photo-1561758033-d89a9ad46330'},
{n:'Carrefour Mart',c:'grocery',d:'Supermarket & Fresh Food',r:'4.8',tm:'25-40',p:'-20%',i:'photo-1542838132-92c53300491e'},
{n:"Аптека 'Aibolit'",c:'pharmacy',d:'Medicines & Health 24/7',r:'4.9',tm:'15-25',p:'0 TJS',i:'photo-1584308666744-24d5c474f2ae'},
{n:'Viva Market',c:'grocery',d:'Groceries & Household',r:'4.6',tm:'20-35',p:'-15%',i:'photo-1578916171728-46686eac8d58'},
{n:'Sephora Dushanbe',c:'beauty',d:'Cosmetics & Perfumes',r:'4.9',tm:'30-45',p:'Gift',i:'photo-1522337360788-8b13dee7a37e'},
{n:'Gulistan Flowers',c:'flowers',d:'Fresh Bouquets & Roses',r:'5.0',tm:'25-35',p:'-25%',i:'photo-1563245372-f21724e3856d'},
{n:'Ширин (Sweets)',c:'sweets',d:'Cakes, Pastries & Desserts',r:'4.8',tm:'20-30',p:'-30%',i:'photo-1578985545062-69928b1d9587'}];
const PROMO={TALABAT20:['f',20],WELCOME50:['f',50],PROMO10:['p',10]}; /* preview only: the server recalculates */
const ME={name:'Парвиз Рахимов',phone:'+992921234567'};
let S={v:'home',cat:'all',store:'',cart:{},promo:'',tip:0,pay:'apple',tid:null,bad:false};
const menuOf=n=>TLB.allMenus(false)[n]||[];
const go=(v,x)=>{Object.assign(S,{v},x||{});render();scrollTo(0,0)};
const setCat=c=>{S.cat=c;render()};
const openStore=i=>go('menu',{store:STORES[i].n});
function add(id,d){S.cart[id]=(S.cart[id]||0)+d;if(S.cart[id]<=0)delete S.cart[id];render()}
function addFrom(id){ /* one store per cart */
  if(Object.keys(S.cart).length&&S.cartStore!==S.store){if(!confirm(t('clear_cart')))return;S.cart={}}
  S.cartStore=S.store;add(id,1)}
function calc(){const m=menuOf(S.cartStore);let sub=0;
  for(const id in S.cart){const it=m.find(x=>x.id==id);if(it)sub+=it.price*S.cart[id]}
  const p=PROMO[S.promo];let d=p?(p[0]=='f'?p[1]:Math.round(sub*p[1]/100)):0;d=Math.min(d,sub);
  return{sub,d,total:Math.max(5,sub-d+(sub?10:0)+S.tip)}}
function applyPromo(){const v=$('pc').value.trim().toUpperCase();if(PROMO[v]){S.promo=v;S.bad=false}else{S.promo='';S.bad=true}render()}
function place(){
  const r=TLB.placeOrder({store:S.cartStore,cart:S.cart,promo:S.promo,tip:S.tip,payment:t(S.pay),address:'Проспект Рудаки, д. 12, кв. 4',client:ME});
  if(r.error){alert(t('err_'+r.error));return}
  S.cart={};S.promo='';S.tip=0;go('track',{tid:r.id})}
function cancelO(){if(confirm(t('confirm_cancel'))){TLB.setStatus(S.tid,'cancelled');go('orders')}}
function sendChat(){const v=$('ci').value.trim();if(v)TLB.chat(S.tid,'client',v)}
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);

function vHome(){const cats=['all','rest','grocery','pharmacy','beauty','flowers','sweets'];
  return `<div class="hd"><small>${t('deliverTo')}</small><b>📍 Проспект Рудаки, 12</b></div>
  <div class="chips">${cats.map(c=>`<div class="chip ${S.cat==c?'on':''}" onclick="setCat('${c}')">${t(c)}</div>`).join('')}</div>
  <div class="pg">${STORES.map((s,i)=>S.cat=='all'||S.cat==s.c?`<div class="card st" onclick="openStore(${i})"><img src="${U(s.i)}" alt=""><div>
   <div class="row"><b>${esc(s.n)}</b>${TLB.isOpen(s.n)?`<span class="tag">${s.p}</span>`:`<span class="tag x">${t('closed')}</span>`}</div>
   <p>${esc(s.d)}</p><p>★ ${s.r} • 🕒 ${s.tm} ${'min'} • 🚴 10 TJS</p></div></div>`:'').join('')}</div>`}
function vMenu(){const m=TLB.allMenus(true)[S.store]||[],open=TLB.isOpen(S.store);
  return `<div class="pg"><button class="btn g" onclick="go('home')">← ${t('back')}</button><h2 style="margin-top:14px">${esc(S.store)} ${open?'':`<span class="tag x">${t('closed')}</span>`}</h2>
  ${m.length?m.map(i=>{const q=S.cartStore==S.store&&S.cart[i.id]||0;return `<div class="card it row"><img src="${esc(i.image)}" alt=""><div class="i"><b>${esc(i.name)}</b>${i.popular?' 🌟':''}<div class="pr">${i.price} TJS</div></div>
   ${q?`<div class="qty"><button onclick="add(${i.id},-1)">−</button><span>${q}</span><button onclick="add(${i.id},1)">+</button></div>`:`<button class="btn" onclick="addFrom(${i.id})">${t('addBtn')}</button>`}</div>`}).join(''):`<div class="card">${t('noMenu')}</div>`}</div>`}
function vCart(){const m=menuOf(S.cartStore),c=calc(),ids=Object.keys(S.cart);
  if(!ids.length)return `<div class="pg"><h2>${t('cartT')}</h2><div class="card">${t('cartEmpty')}</div></div>`;
  return `<div class="pg"><h2>${t('cartT')} — ${esc(S.cartStore)}</h2>
  ${ids.map(id=>{const i=m.find(x=>x.id==id)||{name:'?',price:0};return `<div class="card row"><div><b>${esc(i.name)}</b><div class="pr">${i.price} TJS</div></div><div class="qty"><button onclick="add(${id},-1)">−</button><span>${S.cart[id]}</span><button onclick="add(${id},1)">+</button></div></div>`}).join('')}
  <div class="card"><div class="row"><input type="text" id="pc" placeholder="${t('promo')}" value="${esc(S.promo)}"><button class="btn" onclick="applyPromo()">${t('apply')}</button></div>${S.bad?`<p style="color:#e74c3c;font-size:12px;margin-top:6px">${t('promoBad')}</p>`:''}</div>
  <div class="card"><b>${t('tip')}</b><div class="row" style="margin-top:8px">${[0,3,5,10].map(v=>`<div class="tip ${S.tip==v?'on':''}" onclick="S.tip=${v};render()">${v?v+' TJS':t('none')}</div>`).join('')}</div></div>
  <div class="card"><b>${t('payM')}</b>${['apple','card','cash'].map(p=>`<div class="row" style="padding:9px 0" onclick="S.pay='${p}';render()"><span>${t(p)}</span><input type="radio" ${S.pay==p?'checked':''}></div>`).join('')}</div>
  <div class="card"><div class="row"><span>${t('sub')}</span><span>${c.sub} TJS</span></div><div class="row"><span>${t('disc')}</span><span style="color:#27ae60">−${c.d} TJS</span></div><div class="row"><span>${t('deliv')}</span><span>10 TJS</span></div>
  <div class="row" style="font-size:17px;font-weight:800;margin:10px 0"><span>${t('total')}</span><span class="pr">${c.total} TJS</span></div><button class="btn big" onclick="place()">${t('place')}</button></div></div>`}
function vOrders(){const l=TLB.orders(o=>o.client.phone==ME.phone);
  return `<div class="pg"><h2>${t('orders')}</h2>${l.length?l.map(o=>`<div class="card" onclick="go('track',{tid:${o.id}})"><div class="row"><b>#${o.id} — ${esc(o.store)}</b><span class="pr">${o.total} TJS</span></div><p style="font-size:12px;color:#ff5a00;margin-top:4px">${t(o.status)}</p></div>`).join(''):`<div class="card">${t('noOrders')}</div>`}</div>`}
function vTrack(){const o=TLB.order(S.tid);if(!o)return vOrders();
  const n={pending:0,preparing:1,ready:1,pickedup:2,delivered:3}[o.status],dead=o.status=='rejected'||o.status=='cancelled';
  return `<div class="pg"><button class="btn g" onclick="go('orders')">← ${t('back')}</button>
  <div class="card" style="margin-top:14px"><b>#${o.id} — ${esc(o.store)}</b><p style="color:#ff5a00;font-weight:700;margin:6px 0">${t(o.status)}</p><p style="font-size:12px">${o.total} TJS • ${esc(o.payment)}</p>
  ${o.status=='pending'?`<button class="btn r" style="margin-top:10px" onclick="cancelO()">${t('cancelO')}</button>`:''}</div>
  ${dead?'':`<div class="card">${['pending','preparing','pickedup','delivered'].map((k,i)=>`<div class="step ${i<=n?'on':''}"><i></i>${t('s_'+k)}</div>`).join('')}</div>`}
  ${o.driver&&!dead?`<div class="card"><b>🛵 ${t('courier')}: ${esc(o.driverName)}</b><div class="chat" id="ch">${o.chat.map(m=>`<div class="m ${m.s=='client'?'me':''}">${esc(m.t)}</div>`).join('')}</div>
  <div class="row"><input type="text" id="ci" placeholder="${t('chatH')}"><button class="btn" onclick="sendChat()">${t('send')}</button></div></div>`:''}</div>`}
function vMe(){return `<div class="pg"><div class="card" style="text-align:center"><div style="font-size:40px">👤</div><b>${ME.name}</b><p style="font-size:12px;color:#718096">${ME.phone}</p></div>
  <div class="card row"><b>${t('langL')}</b><div><button class="btn ${TLB.lang()=='ru'?'':'g'}" onclick="TLB.setLang('ru')">RU</button> <button class="btn ${TLB.lang()=='en'?'':'g'}" onclick="TLB.setLang('en')">EN</button></div></div>
  <p style="font-size:11px;color:#a0aec0;text-align:center">${t('note')}</p></div>`}
function render(){
  const V={home:vHome,menu:vMenu,cart:vCart,orders:vOrders,track:vTrack,me:vMe}[S.v]();
  const nav=['home','orders','me'],ic={home:'🏠',orders:'📦',me:'👤'};
  const bar=cartCount()&&(S.v=='home'||S.v=='menu')?`<div class="bar" onclick="go('cart')"><span>🛒 ${t('cartT')} (${cartCount()})</span><span>${calc().total} TJS</span></div>`:'';
  const a=document.activeElement,keep=a&&a.id=='ci'?a.value:null;
  $('app').innerHTML=V+bar+`<div class="nav">${nav.map(k=>`<div class="${S.v==k||(k=='orders'&&S.v=='track')?'on':''}" onclick="go('${k}')"><span>${ic[k]}</span>${t(k)}</div>`).join('')}</div>`;
  if(keep!==null&&$('ci')){$('ci').value=keep;$('ci').focus()}
  const ch=$('ch');if(ch)ch.scrollTop=ch.scrollHeight}
TLB.on(render);render();
</script></body></html>
